# Builds the WKU app, signs it with WKU's Developer ID certificates, has Apple notarize it, and publishes
# a GitHub release with the signed .pkg and .dmg.
#
# Starts when a v* tag is pushed (the upstream sync workflow pushes one when a sync PR is merged), or by
# hand for an existing tag. Setup: docs/WKU-RELEASES.md.

name: WKU Signed Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, sign and publish (for example v2026.11.13.1500)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: wku-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize and publish
    runs-on: macos-26
    # Holds the signing secrets. Give it required reviewers and limit it to the wku-customizations branch.
    environment: release-signing
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$PUSH_TAG}"
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)+$ ]]; then
            echo "::error::'$TAG' is not a release tag like v2026.11.13.1500"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Only sign code that is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! git merge-base --is-ancestor HEAD "origin/${DEFAULT_BRANCH}"; then
            echo "::error::${TAG} is not on ${DEFAULT_BRANCH}; refusing to sign it."
            exit 1
          fi

      - name: Select Xcode 26
        run: |
          XCODE="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)"
          [ -n "${XCODE}" ] || { echo "::error::No Xcode 26 on this runner"; exit 1; }
          sudo xcode-select -s "${XCODE}"
          xcodebuild -version
          swift --version

      - name: Import signing certificates and notary credentials
        env:
          APP_P12: ${{ secrets.APPLE_APP_CERT_P12_BASE64 }}
          APP_P12_PASSWORD: ${{ secrets.APPLE_APP_CERT_P12_PASSWORD }}
          PKG_P12: ${{ secrets.APPLE_INSTALLER_CERT_P12_BASE64 }}
          PKG_P12_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          for v in APP_P12 APP_P12_PASSWORD PKG_P12 PKG_P12_PASSWORD NOTARY_APPLE_ID NOTARY_PASSWORD NOTARY_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret for $v is not set in the release-signing environment"; exit 1; fi
          done
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$APP_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$PKG_P12" | base64 --decode > "$RUNNER_TEMP/pkg.p12"
          security import "$RUNNER_TEMP/app.p12" -P "$APP_P12_PASSWORD" -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/pkg.p12" -P "$PKG_P12_PASSWORD" -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/pkgbuild -T /usr/bin/productsign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/pkg.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Also validates the Apple ID credentials now, before a long build.
          xcrun notarytool store-credentials "wkuxfer-ci" --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" --team-id "$NOTARY_TEAM_ID" --keychain "$KEYCHAIN"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security find-identity -v "$KEYCHAIN"

      - name: Build, sign and notarize
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          NOTARY_PROFILE: wkuxfer-ci
        run: bash tools/ci-build-release.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          NOTES="dist/signed/RELEASE_NOTES.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run for an existing release: replace the assets, leave the title and notes alone.
            gh release upload "$TAG" dist/signed/*.pkg dist/signed/*.dmg dist/signed/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/signed/*.pkg dist/signed/*.dmg dist/signed/SHA256SUMS \
              --verify-tag --title "$(cat dist/signed/RELEASE_TITLE)" --notes-file "$NOTES"
          fi

      - name: Remove the temporary keychain
        if: ${{ always() }}
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP"/app.p12 "$RUNNER_TEMP"/pkg.p12
